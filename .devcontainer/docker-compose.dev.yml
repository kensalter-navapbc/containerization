version: '3.8'

services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker-host.sock
    command: sleep infinity
    networks:
      - weatherapp-network
    depends_on:
      - weatherapp-db
    environment:
      - DOCKER_HOST=unix:///var/run/docker-host.sock

networks:
  weatherapp-network:
    external: true