<header>
  <div class="container">
    <h1>{{title}}</h1>
    
    <div class="controls">
      <button 
        type="button"
        class="refresh-btn" 
        [disabled]="loading" 
        (click)="loadWeatherData()">
        {{loading ? 'Loading...' : 'Refresh'}}
      </button>
    </div>
  </div>
</header>

<main class="container">
  
  <div *ngIf="error" class="error">
    {{error}}
  </div>
  
  <div *ngIf="loading" class="loading">
    Loading weather data...
  </div>
  
  <div *ngIf="weatherData.length > 0 && !loading" class="weather-data">
    <h2>Weather Forecast</h2>
    <div class="weather-grid">
      <div *ngFor="let item of weatherData" class="weather-card">
        <div class="date">{{item.date | date:'yyyy-MM-dd'}}</div>
        <div class="temperature">
          <div class="celsius">{{item.temperatureC}}°C</div>
          <div class="fahrenheit">({{item.temperatureF}}°F)</div>
        </div>
        <div class="summary">{{item.summary}}</div>
      </div>
    </div>
  </div>
</main>

<router-outlet></router-outlet>
