name: Deploy to Azure Container Apps

# Manual trigger for now
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Automatic deployment on main branch push (uncomment when ready):
# on:
#   push:
#     branches: [ main ]
#     paths-ignore:
#       - '*.md'
#       - 'docs/**'
#   workflow_dispatch:

env:
  AZURE_LOCATION: eastus
  
  # Container Registry
  REGISTRY_NAME: weatherappregistry
  
jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Set version with Nerdbank.GitVersioning
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Set deployment variables
      run: |
        echo "Setting deployment variables for ${{ github.event.inputs.environment }} environment..."
        
        # Set version suffix based on environment
        if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
          # Create short version hash (first 8 chars of sanitized version)
          CLEAN_VERSION=$(echo "${{ steps.nbgv.outputs.SemVer2 }}" | sed 's/[^a-zA-Z0-9]//g' | cut -c1-8 | tr '[:upper:]' '[:lower:]')
          VERSION_SUFFIX="-$CLEAN_VERSION"
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
        else
          VERSION_SUFFIX=""
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV
          echo "CLEAN_VERSION=" >> $GITHUB_ENV
        fi
        
        # Set resource names with version suffix for staging (keeping names under 32 chars)
        echo "AZURE_RESOURCE_GROUP=weather-${{ github.event.inputs.environment }}-rg$VERSION_SUFFIX" >> $GITHUB_ENV
        echo "CONTAINER_APPS_ENVIRONMENT=weather-${{ github.event.inputs.environment }}-env$VERSION_SUFFIX" >> $GITHUB_ENV
        echo "BACKEND_APP_NAME=weather-api-${{ github.event.inputs.environment }}$VERSION_SUFFIX" >> $GITHUB_ENV
        echo "FRONTEND_APP_NAME=weather-web-${{ github.event.inputs.environment }}$VERSION_SUFFIX" >> $GITHUB_ENV
        echo "DATABASE_APP_NAME=weather-db-${{ github.event.inputs.environment }}$VERSION_SUFFIX" >> $GITHUB_ENV
        
        # Set registry name with environment suffix
        echo "REGISTRY_NAME=weatherappregistry${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        
        echo "📋 Deployment Configuration:"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Version: ${{ steps.nbgv.outputs.SemVer2 }}"
        echo "Clean Version: $CLEAN_VERSION"
        echo "Resource Group: weatherapp-${{ github.event.inputs.environment }}-rg$VERSION_SUFFIX"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create Resource Group
      run: |
        echo "Checking if resource group exists..."
        
        # Check if resource group exists
        if az group show --name ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Resource group ${{ env.AZURE_RESOURCE_GROUP }} already exists"
        else
          echo "Creating resource group ${{ env.AZURE_RESOURCE_GROUP }}..."
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }}
        fi

    - name: Create Azure Container Registry
      run: |
        echo "Checking if container registry name is available..."
        echo "Registry name: ${{ env.REGISTRY_NAME }}"
        echo "Resource group: ${{ env.AZURE_RESOURCE_GROUP }}"
        
        # Check if registry name is available globally
        NAME_CHECK=$(az acr check-name --name ${{ env.REGISTRY_NAME }} --query nameAvailable -o tsv)
        echo "Name availability check result: $NAME_CHECK"
        
        if [ "$NAME_CHECK" = "true" ]; then
          echo "Creating container registry ${{ env.REGISTRY_NAME }}..."
          az acr create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.REGISTRY_NAME }} \
            --sku Basic \
            --admin-enabled true
          echo "✅ Registry created successfully"
        else
          echo "Container registry name ${{ env.REGISTRY_NAME }} is already in use"
          # Try to find the existing registry
          EXISTING_RG=$(az acr list --query "[?name=='${{ env.REGISTRY_NAME }}'].resourceGroup" -o tsv 2>/dev/null || echo "")
          if [ -n "$EXISTING_RG" ]; then
            echo "Found existing registry in resource group: $EXISTING_RG"
            echo "Using existing registry instead of creating new one"
          else
            echo "ERROR: Registry name is taken but not accessible to this subscription"
            echo "Available registries in subscription:"
            az acr list --query "[].name" -o table
            exit 1
          fi
        fi
        
        # Get registry login server (try current resource group first, then search all accessible registries)
        REGISTRY_SERVER=$(az acr show --name ${{ env.REGISTRY_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query loginServer --output tsv 2>/dev/null || echo "")
        
        if [ -z "$REGISTRY_SERVER" ]; then
          echo "Registry not found in current resource group, searching all accessible registries..."
          REGISTRY_SERVER=$(az acr show --name ${{ env.REGISTRY_NAME }} --query loginServer --output tsv 2>/dev/null || echo "")
        fi
        
        if [ -z "$REGISTRY_SERVER" ]; then
          echo "ERROR: Could not get registry login server for ${{ env.REGISTRY_NAME }}"
          echo "Available registries:"
          az acr list --query "[].{name:name, resourceGroup:resourceGroup, loginServer:loginServer}" -o table
          exit 1
        fi
        
        echo "REGISTRY_LOGIN_SERVER=$REGISTRY_SERVER" >> $GITHUB_ENV
        echo "Registry login server: $REGISTRY_SERVER"

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ env.REGISTRY_NAME }}

    - name: Build and Push Database Container
      run: |
        echo "Building and pushing database container..."
        echo "Current version: ${{ steps.nbgv.outputs.SemVer2 }}"
        echo "Registry server: ${{ env.REGISTRY_LOGIN_SERVER }}"
        echo "Expected image: ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }}"
        cd database
        
        # Build and tag the database image
        echo "Building database Docker image..."
        if ! docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }} .; then
          echo "❌ Database Docker build failed!"
          exit 1
        fi
        echo "✅ Database image built successfully"
        
        docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:latest .
        
        # Push the images
        echo "Pushing database images to registry..."
        if ! docker push ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }}; then
          echo "❌ Failed to push database image with version tag"
          exit 1
        fi
        echo "✅ Database versioned image pushed successfully"
        
        if ! docker push ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:latest; then
          echo "❌ Failed to push database latest image"
          exit 1
        fi
        echo "✅ Database latest image pushed successfully"

    - name: Build and Push Backend Container
      run: |
        echo "Building and pushing backend container..."
        
        # Create Dockerfile for backend
        cat > Backend/Dockerfile << 'EOF'
        FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS base
        WORKDIR /app
        EXPOSE 80
        EXPOSE 443

        FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
        WORKDIR /src
        COPY ["Backend.csproj", "."]
        RUN dotnet restore "Backend.csproj"
        COPY . .
        WORKDIR "/src"
        RUN dotnet build "Backend.csproj" -c Release -o /app/build

        FROM build AS publish
        RUN dotnet publish "Backend.csproj" -c Release -o /app/publish

        FROM base AS final
        WORKDIR /app
        COPY --from=publish /app/publish .
        
        # Set environment variables for container detection
        ENV DOTNET_RUNNING_IN_CONTAINER=true
        ENV ASPNETCORE_URLS=http://+:80
        
        ENTRYPOINT ["dotnet", "Backend.dll"]
        EOF
        
        cd Backend
        
        # Build and tag the backend image
        echo "Building backend Docker image..."
        if ! docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-backend:${{ steps.nbgv.outputs.SemVer2 }} .; then
          echo "❌ Backend Docker build failed!"
          exit 1
        fi
        echo "✅ Backend image built successfully"
        
        docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-backend:latest .
        
        # Push the images
        echo "Pushing backend images to registry..."
        if ! docker push ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-backend:${{ steps.nbgv.outputs.SemVer2 }}; then
          echo "❌ Failed to push backend image with version tag"
          exit 1
        fi
        echo "✅ Backend versioned image pushed successfully"
        
        if ! docker push ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-backend:latest; then
          echo "❌ Failed to push backend latest image"
          exit 1
        fi
        echo "✅ Backend latest image pushed successfully"

    - name: Build and Push Frontend Container
      run: |
        echo "Building and pushing frontend container..."
        
        # Install frontend dependencies and build
        cd frontend/ClientApp
        npm install
        npm run build
        cd ../..
        
        # Create Dockerfile for frontend (ASP.NET Core hosting Angular)
        cat > frontend/Dockerfile << 'EOF'
        FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS base
        WORKDIR /app
        EXPOSE 80
        EXPOSE 443

        FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
        WORKDIR /src

        # Install Node.js
        RUN apt-get update && apt-get install -y curl
        RUN curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
        RUN apt-get install -y nodejs

        COPY ["FrontEnd.csproj", "."]
        RUN dotnet restore "FrontEnd.csproj"
        COPY . .
        WORKDIR "/src"
        RUN dotnet build "FrontEnd.csproj" -c Release -o /app/build

        FROM build AS publish
        RUN dotnet publish "FrontEnd.csproj" -c Release -o /app/publish

        FROM base AS final
        WORKDIR /app
        COPY --from=publish /app/publish .
        
        ENV ASPNETCORE_URLS=http://+:80
        
        ENTRYPOINT ["dotnet", "FrontEnd.dll"]
        EOF
        
        cd frontend
        
        # Build and tag the frontend image
        echo "Building frontend Docker image..."
        if ! docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-frontend:${{ steps.nbgv.outputs.SemVer2 }} .; then
          echo "❌ Frontend Docker build failed!"
          exit 1
        fi
        echo "✅ Frontend image built successfully"
        
        docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-frontend:latest .
        
        # Push the images
        echo "Pushing frontend images to registry..."
        if ! docker push ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-frontend:${{ steps.nbgv.outputs.SemVer2 }}; then
          echo "❌ Failed to push frontend image with version tag"
          exit 1
        fi
        echo "✅ Frontend versioned image pushed successfully"
        
        if ! docker push ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-frontend:latest; then
          echo "❌ Failed to push frontend latest image"
          exit 1
        fi
        echo "✅ Frontend latest image pushed successfully"

    - name: Verify Container Images Exist
      run: |
        echo "🔍 Verifying container images exist in registry..."
        
        # Check if database image exists
        echo "Checking database image..."
        if az acr repository show --name ${{ env.REGISTRY_NAME }} --image weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }} > /dev/null 2>&1; then
          echo "✅ Database image exists"
        else
          echo "❌ Database image not found: weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }}"
          echo "Available database images:"
          az acr repository show-tags --name ${{ env.REGISTRY_NAME }} --repository weatherapp-database --orderby time_desc --top 5 || echo "No database images found"
          exit 1
        fi
        
        # Check if backend image exists
        echo "Checking backend image..."
        if az acr repository show --name ${{ env.REGISTRY_NAME }} --image weatherapp-backend:${{ steps.nbgv.outputs.SemVer2 }} > /dev/null 2>&1; then
          echo "✅ Backend image exists"
        else
          echo "❌ Backend image not found: weatherapp-backend:${{ steps.nbgv.outputs.SemVer2 }}"
          echo "Available backend images:"
          az acr repository show-tags --name ${{ env.REGISTRY_NAME }} --repository weatherapp-backend --orderby time_desc --top 5 || echo "No backend images found"
          exit 1
        fi
        
        # Check if frontend image exists
        echo "Checking frontend image..."
        if az acr repository show --name ${{ env.REGISTRY_NAME }} --image weatherapp-frontend:${{ steps.nbgv.outputs.SemVer2 }} > /dev/null 2>&1; then
          echo "✅ Frontend image exists"
        else
          echo "❌ Frontend image not found: weatherapp-frontend:${{ steps.nbgv.outputs.SemVer2 }}"
          echo "Available frontend images:"
          az acr repository show-tags --name ${{ env.REGISTRY_NAME }} --repository weatherapp-frontend --orderby time_desc --top 5 || echo "No frontend images found"
          exit 1
        fi
        
        echo "✅ All required images are available in the registry"

    - name: Create VNet and Container Apps Environment
      run: |
        echo "Setting up networking for Container Apps..."
        
        # Check if the extension is installed
        az extension add --name containerapp --upgrade
        
        # Register required providers
        az provider register --namespace Microsoft.App
        az provider register --namespace Microsoft.OperationalInsights
        az provider register --namespace Microsoft.Network
        
        # Set VNet names
        VNET_NAME="weather-${{ github.event.inputs.environment }}-vnet${{ env.VERSION_SUFFIX }}"
        SUBNET_NAME="containerapp-subnet"
        
        echo "VNet name: $VNET_NAME"
        echo "Subnet name: $SUBNET_NAME"
        
        # Create VNet if it doesn't exist
        if az network vnet show --name $VNET_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "VNet $VNET_NAME already exists"
        else
          echo "Creating VNet $VNET_NAME..."
          az network vnet create \
            --name $VNET_NAME \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --address-prefix 10.0.0.0/16
        fi
        
        # Create subnet if it doesn't exist
        if az network vnet subnet show --name $SUBNET_NAME --vnet-name $VNET_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Subnet $SUBNET_NAME already exists"
          # Check if delegation is set, update if needed
          DELEGATION=$(az network vnet subnet show \
            --name $SUBNET_NAME \
            --vnet-name $VNET_NAME \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'delegations[0].serviceName' -o tsv 2>/dev/null || echo "")
          
          if [ "$DELEGATION" != "Microsoft.App/environments" ]; then
            echo "Adding delegation to existing subnet..."
            az network vnet subnet update \
              --name $SUBNET_NAME \
              --vnet-name $VNET_NAME \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --delegations Microsoft.App/environments
          fi
        else
          echo "Creating subnet $SUBNET_NAME with Container Apps delegation..."
          az network vnet subnet create \
            --name $SUBNET_NAME \
            --vnet-name $VNET_NAME \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --address-prefix 10.0.0.0/23 \
            --delegations Microsoft.App/environments
        fi
        
        # Get subnet ID for Container Apps environment
        SUBNET_ID=$(az network vnet subnet show \
          --name $SUBNET_NAME \
          --vnet-name $VNET_NAME \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query id -o tsv)
        
        echo "Subnet ID: $SUBNET_ID"
        echo "SUBNET_ID=$SUBNET_ID" >> $GITHUB_ENV
        
        # Check if Container Apps environment exists
        if az containerapp env show --name ${{ env.CONTAINER_APPS_ENVIRONMENT }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Container Apps environment ${{ env.CONTAINER_APPS_ENVIRONMENT }} already exists"
        else
          echo "Creating Container Apps environment with VNet integration..."
          az containerapp env create \
            --name ${{ env.CONTAINER_APPS_ENVIRONMENT }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --infrastructure-subnet-resource-id $SUBNET_ID \
            --internal-only false
          echo "✅ Container Apps environment created with VNet integration"
        fi

    - name: Deploy Database Container App
      run: |
        echo "Deploying database container app..."
        echo "App name: ${{ env.DATABASE_APP_NAME }}"
        echo "Resource group: ${{ env.AZURE_RESOURCE_GROUP }}"
        echo "Environment: ${{ env.CONTAINER_APPS_ENVIRONMENT }}"
        echo "Image: ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }}"
        
        # Check if container app exists and delete it to recreate fresh (ensures proper registry auth)
        if az containerapp show --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Deleting existing database container app to recreate with fresh configuration..."
          az containerapp delete --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --yes
        fi
        
        echo "Creating new database container app..."
        
        # Get registry password safely
        echo "Getting registry credentials..."
        REGISTRY_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query "passwords[0].value" -o tsv)
        if [ -z "$REGISTRY_PASSWORD" ]; then
          echo "ERROR: Could not get registry password"
          exit 1
        fi
        echo "✅ Registry credentials obtained"
        
        echo "Creating container app..."
        # Use our custom database image that creates the WeatherApp database
        echo "Using custom database image that includes database initialization..."
        az containerapp create \
            --name ${{ env.DATABASE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENVIRONMENT }} \
            --image ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-database:${{ steps.nbgv.outputs.SemVer2 }} \
            --registry-server ${{ env.REGISTRY_LOGIN_SERVER }} \
            --registry-username ${{ env.REGISTRY_NAME }} \
            --registry-password "$REGISTRY_PASSWORD" \
            --target-port 1433 \
            --ingress internal \
            --transport tcp \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 2.0 \
            --memory 4.0Gi \
            --env-vars \
              ACCEPT_EULA=Y \
              MSSQL_SA_PASSWORD=secretref:sql-sa-password \
              MSSQL_PID=Developer \
            --secrets sql-sa-password="${{ secrets.SQL_SA_PASSWORD }}"
        echo "✅ Database container app created successfully"

    - name: Initialize Database Schema
      run: |
        echo "Waiting for database container to be ready and initializing schema..."
        
        # Wait for database container to be running
        echo "Waiting for database container to be ready..."
        for i in {1..60}; do
          DB_STATUS=$(az containerapp show --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
          if [ "$DB_STATUS" = "Running" ]; then
            echo "✅ Database container is running"
            break
          fi
          echo "Attempt $i/60 - Database status: $DB_STATUS"
          sleep 10
        done
        
        if [ "$DB_STATUS" != "Running" ]; then
          echo "❌ Database container failed to start"
          az containerapp logs show --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --tail 50 || echo "Could not get logs"
          exit 1
        fi
        
        # Get database FQDN for connection
        DATABASE_FQDN=$(az containerapp show \
          --name ${{ env.DATABASE_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        echo "Database FQDN: $DATABASE_FQDN"
        
        # Create a temporary container to run database initialization
        echo "Creating temporary container to initialize database..."
        
        # Create initialization script
        cat > init-db.sql << 'EOF'
        -- Create the WeatherApp database
        USE master;
        
        IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'WeatherApp')
        BEGIN
            CREATE DATABASE WeatherApp;
        END
        
        USE WeatherApp;
        
        -- Create WeatherForecast table if it doesn't exist
        IF NOT EXISTS (SELECT * FROM sysobjects WHERE name='WeatherForecast' AND xtype='U')
        BEGIN
            CREATE TABLE WeatherForecast (
                Id int IDENTITY(1,1) PRIMARY KEY,
                Date datetime2 NOT NULL,
                TemperatureC int NOT NULL,
                Summary nvarchar(max) NULL
            );
        END
        
        PRINT 'Database and table created successfully.';
        EOF
        
        # Skip database initialization for now - let the backend handle it
        echo "Skipping external database initialization - the backend will handle database creation"
        echo "Database is ready for backend connections"
        
        echo "✅ Database schema initialization completed"

    - name: Deploy Backend Container App
      run: |
        echo "Deploying backend container app..."
        
        # For internal TCP, try using the container name directly instead of FQDN
        # DATABASE_FQDN=$(az containerapp show \
        #   --name ${{ env.DATABASE_APP_NAME }} \
        #   --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
        #   --query properties.configuration.ingress.fqdn -o tsv)
        DATABASE_FQDN=${{ env.DATABASE_APP_NAME }}
        
        # Check if container app exists and delete it to recreate fresh (avoids secret ref issues)
        if az containerapp show --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Deleting existing backend container app to recreate with new configuration..."
          az containerapp delete --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --yes
        fi
        
        
        # Debug: Check if the secret is being passed correctly
        echo "Secret value length: $(echo '${{ secrets.SQL_SA_PASSWORD }}' | wc -c)"
        echo "Secret starts with: $(echo '${{ secrets.SQL_SA_PASSWORD }}' | head -c 10)..."
        
        # Get registry password safely
        REGISTRY_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query "passwords[0].value" -o tsv)
        
        az containerapp create \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENVIRONMENT }} \
            --image ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-backend:${{ steps.nbgv.outputs.SemVer2 }} \
            --registry-server ${{ env.REGISTRY_LOGIN_SERVER }} \
            --registry-username ${{ env.REGISTRY_NAME }} \
            --registry-password "$REGISTRY_PASSWORD" \
            --target-port 80 \
            --ingress external \
            --min-replicas 1 \
            --max-replicas 3 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --env-vars \
              ASPNETCORE_ENVIRONMENT=Production \
              DOTNET_RUNNING_IN_CONTAINER=true \
              SQL_SERVER_HOST=$DATABASE_FQDN \
              SQL_SA_PASSWORD="${{ secrets.SQL_SA_PASSWORD }}" \
              STARTUP_DELAY_SECONDS=30 \
              DEBUG_NETWORK=true
        echo "✅ Backend container app created successfully"

    - name: Deploy Frontend Container App
      run: |
        echo "Deploying frontend container app..."
        
        # Get backend FQDN for API calls
        BACKEND_FQDN=$(az containerapp show \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        # Check if container app exists and delete it to recreate fresh (ensures proper ingress config)
        if az containerapp show --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
          echo "Deleting existing frontend container app to recreate with correct ingress configuration..."
          az containerapp delete --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --yes
        fi
        
        echo "Creating new frontend container app..."
        
        # Get registry password safely
        REGISTRY_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query "passwords[0].value" -o tsv)
        
        az containerapp create \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENVIRONMENT }} \
            --image ${{ env.REGISTRY_LOGIN_SERVER }}/weatherapp-frontend:${{ steps.nbgv.outputs.SemVer2 }} \
            --registry-server ${{ env.REGISTRY_LOGIN_SERVER }} \
            --registry-username ${{ env.REGISTRY_NAME }} \
            --registry-password "$REGISTRY_PASSWORD" \
            --target-port 80 \
            --ingress external \
            --min-replicas 1 \
            --max-replicas 3 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --env-vars \
              ASPNETCORE_ENVIRONMENT=Production \
              BACKEND_API_URL=https://$BACKEND_FQDN
        echo "✅ Frontend container app created successfully"

    - name: Verify Container Apps Health
      run: |
        echo "🔍 Checking container app health..."
        echo "=================================="
        
        # Check database container app
        echo "Database Container App Status:"
        DB_STATUS=$(az containerapp show --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
        echo "  Status: $DB_STATUS"
        
        if [ "$DB_STATUS" != "Running" ]; then
          echo "  ❌ Database container is not running"
          echo "  Checking logs..."
          az containerapp logs show --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --tail 50 || echo "Could not get logs"
        else
          echo "  ✅ Database container is running"
        fi
        
        # Check backend container app
        echo "Backend Container App Status:"
        BACKEND_STATUS=$(az containerapp show --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
        echo "  Status: $BACKEND_STATUS"
        
        if [ "$BACKEND_STATUS" != "Running" ]; then
          echo "  ❌ Backend container is not running"
          echo "  Checking logs..."
          az containerapp logs show --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --tail 50 || echo "Could not get logs"
        else
          echo "  ✅ Backend container is running"
        fi
        
        # Check frontend container app
        echo "Frontend Container App Status:"
        FRONTEND_STATUS=$(az containerapp show --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
        echo "  Status: $FRONTEND_STATUS"
        
        if [ "$FRONTEND_STATUS" != "Running" ]; then
          echo "  ❌ Frontend container is not running"
          echo "  Checking logs..."
          az containerapp logs show --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --tail 50 || echo "Could not get logs"
        else
          echo "  ✅ Frontend container is running"
        fi
        
        # Wait for apps to be ready
        echo ""
        echo "⏳ Waiting for containers to be ready (up to 5 minutes)..."
        for i in {1..30}; do
          DB_STATUS=$(az containerapp show --name ${{ env.DATABASE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
          BACKEND_STATUS=$(az containerapp show --name ${{ env.BACKEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
          FRONTEND_STATUS=$(az containerapp show --name ${{ env.FRONTEND_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "properties.runningStatus" -o tsv 2>/dev/null || echo "ERROR")
          
          if [ "$DB_STATUS" = "Running" ] && [ "$BACKEND_STATUS" = "Running" ] && [ "$FRONTEND_STATUS" = "Running" ]; then
            echo "✅ All containers are running!"
            break
          fi
          
          echo "  Attempt $i/30 - DB: $DB_STATUS, Backend: $BACKEND_STATUS, Frontend: $FRONTEND_STATUS"
          sleep 10
        done

    - name: Display Deployment Information
      run: |
        echo "🎉 Deployment completed successfully!"
        echo ""
        echo "📋 Deployment Information:"
        echo "=========================="
        echo "🏷️  Version: ${{ steps.nbgv.outputs.SemVer2 }}"
        echo "🌍 Environment: ${{ github.event.inputs.environment }}"
        
        # Get application URLs
        FRONTEND_URL=$(az containerapp show \
          --name ${{ env.FRONTEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        BACKEND_URL=$(az containerapp show \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        echo "🌐 Frontend URL: https://$FRONTEND_URL"
        echo "🔧 Backend API URL: https://$BACKEND_URL"
        echo "📊 Backend Swagger: https://$BACKEND_URL/swagger"
        echo ""
        echo "🧪 Testing URLs:"
        
        # Test frontend URL
        echo -n "Frontend: "
        if curl -s --max-time 30 --head "https://$FRONTEND_URL" > /dev/null; then
          echo "✅ Responding"
        else
          echo "❌ Not responding"
        fi
        
        # Test backend URL
        echo -n "Backend: "
        if curl -s --max-time 30 --head "https://$BACKEND_URL" > /dev/null; then
          echo "✅ Responding"
        else
          echo "❌ Not responding"
        fi
        
        # Test backend health endpoint (if it exists)
        echo -n "Backend Health: "
        if curl -s --max-time 30 "https://$BACKEND_URL/health" > /dev/null 2>&1; then
          echo "✅ Health endpoint responding"
        else
          echo "⚠️ Health endpoint not available (may be normal)"
        fi
        echo ""
        echo "🏗️ Infrastructure:"
        echo "- Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
        echo "- Location: ${{ env.AZURE_LOCATION }}"
        echo "- Container Apps Environment: ${{ env.CONTAINER_APPS_ENVIRONMENT }}"
        echo "- Container Registry: ${{ env.REGISTRY_NAME }}"
        echo ""
        echo "🐳 Container Apps:"
        echo "- Database: ${{ env.DATABASE_APP_NAME }}"
        echo "- Backend: ${{ env.BACKEND_APP_NAME }}"
        echo "- Frontend: ${{ env.FRONTEND_APP_NAME }}"

    - name: Update Environment Variables (if needed)
      run: |
        echo "Updating container apps with correct service discovery..."
        
        # Get FQDNs for internal communication
        DATABASE_FQDN=$(az containerapp show \
          --name ${{ env.DATABASE_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        BACKEND_FQDN=$(az containerapp show \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)
        
        # Update backend with database connection
        az containerapp update \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --replace-env-vars \
            ASPNETCORE_ENVIRONMENT=Production \
            DOTNET_RUNNING_IN_CONTAINER=true \
            SQL_SERVER_HOST=$DATABASE_FQDN \
            SQL_SA_PASSWORD="${{ secrets.SQL_SA_PASSWORD }}"
        
        echo "✅ Service discovery configured successfully!"